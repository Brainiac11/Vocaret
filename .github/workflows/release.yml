name: Release

# Pushing a tag like v0.2.0 builds the extension and attaches it to a GitHub
# release. If the VSCE_PAT / OVSX_PAT repository secrets are set, it is also
# published to the VS Code Marketplace / Open VSX (see docs/PUBLISHING.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Check the tag matches the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="$(node -p 'require("./extension/package.json").version')"
          [ "v$v" = "$TAG" ] || { echo "tag $TAG does not match extension version $v" >&2; exit 1; }
      - name: Package
        working-directory: extension
        run: npx --yes @vscode/vsce package --out ../vocaret-${{ github.ref_name }}.vsix
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: bash scripts/release_notes.sh "$TAG" > notes.md && gh release create "$TAG" "vocaret-$TAG.vsix" --title "Vocaret $TAG" --notes-file notes.md
      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        if: ${{ env.VSCE_PAT != '' }}
        run: npx --yes @vscode/vsce publish --packagePath "vocaret-${{ github.ref_name }}.vsix"
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        if: ${{ env.OVSX_PAT != '' }}
        run: npx --yes ovsx publish "vocaret-${{ github.ref_name }}.vsix" -p "$OVSX_PAT"
