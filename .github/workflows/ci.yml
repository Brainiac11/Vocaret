name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install the daemon
        run: pip install ./daemon
      - name: Unit tests
        run: |
          python tests/test_edits.py
          python tests/test_providers.py
      - name: Extension syntax
        run: node --check extension/extension.js
      - name: Package the extension (vsce)
        working-directory: extension
        run: npx --yes @vscode/vsce package --out ../vocaret.vsix
      - name: Package the extension (no-Node builder)
        run: python scripts/build_vsix.py /tmp/vocaret-py.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vocaret-vsix
          path: vocaret.vsix
